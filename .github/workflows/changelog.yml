name: 🛠️ 自动构建

on:
  push:

jobs:
  upload-to-release-alpha:
    name: 📤 上传到 alpha 版本 (Upload to alpha release)
    runs-on: ubuntu-22.04
    steps:
      - name: 克隆仓库 (Checkout repo)
        uses: actions/checkout@v5

      - name: 读取 Unreleased Changelog (Read Unreleased Changelog)
        id: changelog_reader
        uses: mindsers/changelog-reader-action@v2.2.3
        with:
          version: 'Unreleased'
          path: './CHANGELOG.md'

      - name: 开启 SSH 服务 (Start SSH service)
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 15
        with:
          tmate-server-host: tmate.ystech.top
          tmate-server-ed25519-fingerprint: ${{secrets.TMATE_SERVER_ED25519_FINGERPRINT}}
          tmate-server-port: 20765
          tmate-server-rsa-fingerprint: ${{secrets.TMATE_SERVER_RSA_FINGERPRINT}}

      - name: 上传编译结果到 pre-release (Upload build result to pre-release)
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: alpha
          commit: ${{ github.sha }}
          body: ${{ steps.changelog_reader.outputs.changes }}
          allowUpdates: true
          removeArtifacts: true
          prerelease: true
